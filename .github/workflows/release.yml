name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME must match v$version from Cargo.toml" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary and documentation
        if: runner.os != 'Windows'
        id: package_unix
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/galerith" dist/package/
          cp README.md LICENSE docs/COMPATIBILITY.md docs/PORT_MATRIX.md dist/package/
          archive="galerith-$TAG-$TARGET.$EXTENSION"
          tar -czf "$GITHUB_WORKSPACE/dist/$archive" -C dist/package .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Package Windows binary and documentation
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/$env:TARGET/release/galerith.exe" dist/package/
          Copy-Item README.md, LICENSE, docs/COMPATIBILITY.md, docs/PORT_MATRIX.md dist/package/
          $archive = "galerith-$env:TAG-$env:TARGET.zip"
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive"
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/${{ steps.package_unix.outputs.archive || steps.package_windows.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum galerith-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/galerith-* dist/SHA256SUMS --verify-tag --title "$TAG" --generate-notes
