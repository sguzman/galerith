name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Roadmap and port-matrix consistency
        run: cargo run --bin galerith-roadmap -- --check
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release

  report-status:
    name: Publish Rust CI commit status
    if: ${{ always() && github.event_name == 'push' }}
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report CI result to commit status API
        uses: actions/github-script@v7
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        with:
          script: |
            const result = process.env.RUST_RESULT;
            const state = result === 'success'
              ? 'success'
              : result === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'galerith/rust-ci',
              description: `Rust CI ${result}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
